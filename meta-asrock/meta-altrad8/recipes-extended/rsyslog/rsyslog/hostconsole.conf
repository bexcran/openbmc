#Host console log

module(load="imuxsock" SysSock.Use="off")

template(name="ConsoleTemplate" type="string" string="%rawmsg%")

ruleset(name="ConsoleCPURuleset") {
  action(type="omfile" file="/var/log/obmc-console-cpu.log" template="ConsoleTemplate")
}
ruleset(name="ConsoleTFARuleset") {
  action(type="omfile" file="/var/log/obmc-console-tfa.log" template="ConsoleTemplate")
}
ruleset(name="ConsoleSCPRuleset") {
  action(type="omfile" file="/var/log/obmc-console-scp.log" template="ConsoleTemplate")
}

# Custom socket for serial console logs.
input(type="imuxsock"
  Socket="/run/rsyslog/console/cpu"
  CreatePath="on"
  UseSpecialParser="off"
  ParseHostname="off"
  ruleset="ConsoleCPURuleset")

input(type="imuxsock"
  Socket="/run/rsyslog/console/tfa"
  CreatePath="on"
  UseSpecialParser="off"
  ParseHostname="off"
  ruleset="ConsoleTFARuleset")

input(type="imuxsock"
  Socket="/run/rsyslog/console/scp"
  CreatePath="on"
  UseSpecialParser="off"
  ParseHostname="off"
  ruleset="ConsoleSCPRuleset")

$EscapeControlCharactersOnReceive off
$DropTrailingLFOnReception off

